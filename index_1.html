<style>
  /* TT Norms: Pfad an das Repo anpassen. Fehlt die Datei, greift der
     System-Fallback und die Seite bleibt funktionsfähig.
     Cordier wird nicht mehr geladen — die Wortmarke ist SVG. */
  @font-face {
    font-family: "TT Norms";
    src: url("fonts/TTNorms-Regular.woff2") format("woff2");
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --black:   #111111;
    --grey:    #8A8A8A;
    --white:   #FFFFFF;
    --scarlet: #F5332C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--white);
    color: var(--black);
    font-family: "TT Norms", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 9vmin 8vmin;
  }

  .mark {
    display: block;
    width: clamp(230px, 42vw, 520px);
    height: auto;
    color: var(--black);
  }

  .meta {
    margin-top: 5vmin;
    margin-left: 0.35em;   /* an den Anlauf des s angeglichen */
  }

  .status {
    font-size: clamp(0.78rem, 1.5vmin, 0.92rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--grey);
  }

  /* Einziges Farbelement der Seite. */
  .status .stop { color: var(--scarlet); }

  .contact {
    margin-top: 1.4em;
    font-size: clamp(0.85rem, 1.7vmin, 1rem);
  }

  .contact a {
    color: var(--black);
    text-decoration: none;
    border-bottom: 1px solid rgba(17,17,17,0.22);
    padding-bottom: 0.12em;
    transition: border-color 0.2s ease;
  }

  .contact a:hover { border-color: var(--black); }

  .contact a:focus-visible {
    outline: 2px solid var(--scarlet);
    outline-offset: 4px;
  }

  /* Ein Auftritt beim Laden. Nicht mehr. */
  .fade { opacity: 0; animation: in 1s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
  .meta.fade { animation-delay: 0.35s; }

  @keyframes in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; opacity: 1; transform: none; }
  }

  @media (max-width: 600px) {
    body { justify-content: flex-end; padding-bottom: 16vh; }
    .mark { width: 76vw; }
  }
</style>
</head>
