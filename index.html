<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stefan Schindele</title>
    <meta name="description" content="Strategische Markenentwicklung & AI-Automatisierung. Wien.">
    <style>
        @font-face {
            font-family: 'Overpass';
            src: url('Overpass-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
        }
        @font-face {
            font-family: 'Overpass';
            src: url('Overpass-Italic-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: italic;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --red: #FF0000;
            --black: #000000;
            --gray: #404040;
            --white: #FFFFFF;
            --font: 'Overpass', Arial, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font);
            font-weight: 300;
            background: var(--red);
            color: var(--white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            z-index: 100;
        }

        .logo-link { display: block; line-height: 0; }

        .logo-svg {
            width: 110px;
            height: auto;
            display: block;
        }
        .logo-svg path { fill: var(--white); }

        .header-nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.5);
            padding-bottom: 1px;
            transition: border-color 0.2s;
        }
        .header-nav a:hover { border-color: var(--white); }

        /* Main */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 72px 3rem 3rem;
            text-align: center;
        }

        .hero {
            max-width: 720px;
            width: 100%;
        }

        .hero-logo {
            margin-bottom: 4rem;
        }
        .hero-logo svg {
            width: min(560px, 80vw);
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .hero-logo svg path { fill: var(--white); }

        .hero-name {
            font-size: clamp(1.1rem, 2vw, 1.3rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            opacity: 0.9;
        }

        .hero-tagline {
            font-size: clamp(0.95rem, 1.5vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0.8;
            margin-bottom: 2.5rem;
        }

        .hero-claim {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 300;
            font-style: italic;
            line-height: 1.3;
            margin-bottom: 3.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.85rem 2.5rem;
            border: 1px solid var(--white);
            color: var(--white);
            text-decoration: none;
            font-family: var(--font);
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: background 0.2s, color 0.2s;
        }
        .btn:hover {
            background: var(--white);
            color: var(--red);
        }

        /* Footer */
        footer {
            padding: 1.5rem 3rem;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0.6;
        }
        footer a {
            color: var(--white);
            text-decoration: none;
        }
        footer a:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            header { padding: 0 1.5rem; }
            main { padding: 72px 1.5rem 2rem; }
            footer { padding: 1.5rem; }
            .hero-logo { margin-bottom: 2.5rem; }
        }
    </style>
</head>
